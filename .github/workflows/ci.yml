name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/kingdomsitter ./cmd/kingdomsitter
      - name: Manifest check
        run: python3 -m json.tool manifest.json >/dev/null
      - name: KoLmafia install tree check
        run: |
          test -f kolmafia/scripts/kingdomsitter.ash
          test -f kolmafia/data/kingdomsitter/runtime.json
